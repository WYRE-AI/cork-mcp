services:
  # Gateway mode. The Cork API key arrives per request on X-Cork-Api-Key.
  # Do not set CORK_API_KEY or env_file here — that would put a static vendor
  # credential in the container. The project .env is used only for Compose
  # interpolation of CONDUIT_S2S_SECRET. For AUTH_MODE=env, pass CORK_API_KEY
  # on that process instead (see the README).
  cork-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      # The host publish above is loopback-only, so this plain-HTTP hop never
      # leaves the machine. For anything else, put a TLS proxy in front or
      # use MCP_TLS_CERT_FILE and MCP_TLS_KEY_FILE instead.
      - MCP_TRUSTED_TLS_INGRESS=1
      - AUTH_MODE=gateway
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - "CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
